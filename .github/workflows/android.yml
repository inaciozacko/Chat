# Monta o APK do Zap na nuvem (GitHub Actions) a cada envio para o GitHub.
# O APK aparece em: aba "Releases" do repositório (e em Actions → execução → Artifacts).
#
# Segredos do repositório (Settings → Secrets and variables → Actions):
#   ZAP_KEYSTORE_BASE64     chave de assinatura (.jks) em base64 — a MESMA sempre, senão o celular não aceita atualizar
#   ZAP_KEYSTORE_PASSWORD   senha da chave
#   GOOGLE_SERVICES_JSON    (opcional) conteúdo do google-services.json do Firebase,
#                           se ele não estiver em native-android/google-services.json

name: App Android

on:
  push:
    branches: [main, master]
    # documentação não muda o app: não gera APK novo
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instala dependências
        run: npm ci --no-audit --no-fund

      - name: Compila o app web
        run: npm run build

      - name: Gera o projeto Android (Capacitor)
        run: npx cap add android

      - name: Aplica o código nativo do Zap
        run: node scripts/android-setup.mjs
        env:
          ZAP_VERSION_CODE: ${{ github.run_number }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}

      - name: Chave de assinatura
        env:
          KS: ${{ secrets.ZAP_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/zap.jks"
            echo "ZAP_KEYSTORE=$RUNNER_TEMP/zap.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Sem o segredo ZAP_KEYSTORE_BASE64: gerando APK de teste (não atualiza por cima de outra versão)"
          fi

      - name: Compila o APK
        working-directory: android
        env:
          ZAP_KEYSTORE_PASSWORD: ${{ secrets.ZAP_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -n "$ZAP_KEYSTORE" ]; then
            ./gradlew --no-daemon --stacktrace assembleRelease
            cp app/build/outputs/apk/release/app-release.apk ../Zap.apk
          else
            ./gradlew --no-daemon --stacktrace assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk ../Zap.apk
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: Zap-apk
          path: Zap.apk

      - name: Publica em Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Zap 1.0.${{ github.run_number }}
          body: APK do Zap. No celular, baixe o arquivo Zap.apk abaixo e toque nele para instalar/atualizar.
          files: Zap.apk
          make_latest: true
